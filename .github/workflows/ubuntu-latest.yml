name: Mac Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: install-superlu
        run: |
          cd install-deps; ./mkdeps.sh  --build-superlu=yes; cd ..    
          chmod +x ci/make-module.sh
          chmod +x ci/make-check.sh

      # Core module
      - name: Build core-unit
        run: ci/make-module.sh core unit 3
      - name: Build core-regression
        run: ci/make-module.sh core regression 3

      # Moments module
      - name: Build moments-unit
        run: ci/make-module.sh moments unit 3
      - name: Build moments-regression
        run: ci/make-module.sh moments regression 3

      # Vlasov module
      - name: Build vlasov-unit
        run: ci/make-module.sh vlasov unit 3
      - name: Build vlasov-regression
        run: ci/make-module.sh vlasov regression 3

      # Gyrokinetic module
      - name: Build gyrokinetic-unit
        run: ci/make-module.sh gyrokinetic unit 3
      - name: Build gyrokinetic-regression
        run: ci/make-module.sh gyrokinetic regression 3

      # PKPM module
      - name: Build pkpm-regression
        run: ci/make-module.sh pkpm regression 3
