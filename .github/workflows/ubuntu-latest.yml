name: Ubuntu CPU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      CC: clang
      # Use a CPU target and disable AVX instructions for Valgrind checks.
      ARCH_FLAGS: -march=skylake -mno-avx -mno-avx2 -mno-avx512f

    steps:
      - name: Set CI paths and parallelism
        run: |
          echo "CI_PATH=$RUNNER_TEMP/gkeyll-ci" >> "$GITHUB_ENV"
          echo "CI_LOG_DIR=$RUNNER_TEMP/gkeyll-ci-logs" >> "$GITHUB_ENV"
          echo "CI_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang gfortran cmake curl git rsync valgrind python-is-python3 python3-numpy libsqlite3-dev libopenblas-dev
          "$CC" --version

      - name: Prepare dependencies and configure
        if: ${{ !cancelled() }}
        run: bash ci/run.sh --machine linux --build_deps --stage prepare

      - name: Build and install core
        if: ${{ !cancelled() }}
        run: |
          source ci/common.sh
          ci_log core-install make -C "$CI_SOURCE_DIR" -j"$CI_JOBS" core-install

      - name: Build core-unit
        if: ${{ !cancelled() }}
        run: ci/make-module.sh core unit

      - name: Check core-unit
        if: ${{ !cancelled() }}
        run: ci/make-check.sh core

      - name: Test core-valcheck
        if: ${{ !cancelled() }}
        run: ci/make-valcheck.sh core "$CI_JOBS"

      - name: Build core-regression
        if: ${{ !cancelled() }}
        run: ci/make-module.sh core regression

      - name: Build and install moments
        if: ${{ !cancelled() }}
        run: |
          source ci/common.sh
          ci_log moments-install make -C "$CI_SOURCE_DIR" -j"$CI_JOBS" moments-install

      - name: Build moments-unit
        if: ${{ !cancelled() }}
        run: ci/make-module.sh moments unit

      - name: Check moments-unit
        if: ${{ !cancelled() }}
        run: ci/make-check.sh moments

      - name: Test moments-valcheck
        if: ${{ !cancelled() }}
        run: ci/make-valcheck.sh moments "$CI_JOBS"

      - name: Build moments-regression
        if: ${{ !cancelled() }}
        run: ci/make-module.sh moments regression

      - name: Build and install vlasov
        if: ${{ !cancelled() }}
        run: |
          source ci/common.sh
          ci_log vlasov-install make -C "$CI_SOURCE_DIR" -j"$CI_JOBS" vlasov-install

      - name: Build vlasov-unit
        if: ${{ !cancelled() }}
        run: ci/make-module.sh vlasov unit

      - name: Check vlasov-unit
        if: ${{ !cancelled() }}
        run: ci/make-check.sh vlasov

      - name: Test vlasov-valcheck
        if: ${{ !cancelled() }}
        run: ci/make-valcheck.sh vlasov "$CI_JOBS"

      - name: Build vlasov-regression
        if: ${{ !cancelled() }}
        run: ci/make-module.sh vlasov regression

      - name: Build and install gyrokinetic
        if: ${{ !cancelled() }}
        run: |
          source ci/common.sh
          ci_log gyrokinetic-install make -C "$CI_SOURCE_DIR" -j"$CI_JOBS" gyrokinetic-install

      - name: Build gyrokinetic-unit
        if: ${{ !cancelled() }}
        run: ci/make-module.sh gyrokinetic unit

      - name: Check gyrokinetic-unit
        if: ${{ !cancelled() }}
        run: ci/make-check.sh gyrokinetic

      - name: Test gyrokinetic-valcheck
        if: ${{ !cancelled() }}
        run: ci/make-valcheck.sh gyrokinetic "$CI_JOBS"

      - name: Build gyrokinetic-regression
        if: ${{ !cancelled() }}
        run: ci/make-module.sh gyrokinetic regression

      - name: Build and install pkpm
        if: ${{ !cancelled() }}
        run: |
          source ci/common.sh
          ci_log pkpm-install make -C "$CI_SOURCE_DIR" -j"$CI_JOBS" pkpm-install

      - name: Build pkpm-unit
        if: ${{ !cancelled() }}
        run: ci/make-module.sh pkpm unit

      - name: Check pkpm-unit
        if: ${{ !cancelled() }}
        run: ci/make-check.sh pkpm

      - name: Test pkpm-valcheck
        if: ${{ !cancelled() }}
        run: ci/make-valcheck.sh pkpm "$CI_JOBS"

      - name: Build pkpm-regression
        if: ${{ !cancelled() }}
        run: ci/make-module.sh pkpm regression

      - name: Build and install gkeyll
        if: ${{ !cancelled() }}
        run: |
          source ci/common.sh
          ci_log gkeyll-install make -C "$CI_SOURCE_DIR" -j"$CI_JOBS" gkeyll-install

      - name: Compare regression tests against main
        if: ${{ !cancelled() }}
        run: bash ci/runregression-against-main.sh

      - name: Publish summary
        if: always()
        run: |
          if [ -f "$CI_LOG_DIR/summary.txt" ]; then
            # Include the Markdown fences (12 bytes) in the 1 MiB limit.
            if (( $(wc -c < "$CI_LOG_DIR/summary.txt") + 12 <= 1024 * 1024 )); then
              {
                echo '```text'
                cat "$CI_LOG_DIR/summary.txt"
                echo '```'
              } > "$GITHUB_STEP_SUMMARY"
            else
              cat "$CI_LOG_DIR/summary.txt"
              echo 'The CI summary exceeds the job summary size limit. See the full report in the **Publish summary** step log or `summary.txt` in the **ubuntu-ci-logs** artifact.' > "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-ci-logs
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: ignore
