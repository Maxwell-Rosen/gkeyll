name: Ubuntu CPU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Set CI paths and parallelism
        run: |
          echo "CI_PATH=$RUNNER_TEMP/gkeyll-ci" >> "$GITHUB_ENV"
          echo "CI_LOG_DIR=$RUNNER_TEMP/gkeyll-ci-logs" >> "$GITHUB_ENV"
          echo "CI_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran cmake curl git rsync valgrind python-is-python3 python3-numpy libsqlite3-dev libopenblas-dev

      - name: Prepare dependencies and configure
        if: ${{ !cancelled() }}
        run: bash ci/run.sh --machine linux --build_deps --stage prepare

      - name: Build and install all modules
        if: ${{ !cancelled() }}
        run: bash ci/run.sh --stage build

      - name: Build core-unit
        if: ${{ !cancelled() }}
        run: ci/make-module.sh core unit

      - name: Test core-unit-run
        if: ${{ !cancelled() }}
        run: ci/make-check.sh core

      - name: Build core-regression
        if: ${{ !cancelled() }}
        run: ci/make-module.sh core regression

      - name: Test core-valcheck
        if: ${{ !cancelled() }}
        run: ci/make-valcheck.sh core "$CI_JOBS"

      - name: Build moments-unit
        if: ${{ !cancelled() }}
        run: ci/make-module.sh moments unit

      - name: Test moments-unit-run
        if: ${{ !cancelled() }}
        run: ci/make-check.sh moments

      - name: Build moments-regression
        if: ${{ !cancelled() }}
        run: ci/make-module.sh moments regression

      - name: Test moments-valcheck
        if: ${{ !cancelled() }}
        run: ci/make-valcheck.sh moments "$CI_JOBS"

      - name: Build vlasov-unit
        if: ${{ !cancelled() }}
        run: ci/make-module.sh vlasov unit

      - name: Test vlasov-unit-run
        if: ${{ !cancelled() }}
        run: ci/make-check.sh vlasov

      - name: Build vlasov-regression
        if: ${{ !cancelled() }}
        run: ci/make-module.sh vlasov regression

      - name: Test vlasov-valcheck
        if: ${{ !cancelled() }}
        run: ci/make-valcheck.sh vlasov "$CI_JOBS"

      - name: Build gyrokinetic-unit
        if: ${{ !cancelled() }}
        run: ci/make-module.sh gyrokinetic unit

      - name: Test gyrokinetic-unit-run
        if: ${{ !cancelled() }}
        run: ci/make-check.sh gyrokinetic

      - name: Build gyrokinetic-regression
        if: ${{ !cancelled() }}
        run: ci/make-module.sh gyrokinetic regression

      - name: Test gyrokinetic-valcheck
        if: ${{ !cancelled() }}
        run: ci/make-valcheck.sh gyrokinetic "$CI_JOBS"

      - name: Build pkpm-unit
        if: ${{ !cancelled() }}
        run: ci/make-module.sh pkpm unit

      - name: Test pkpm-unit-run
        if: ${{ !cancelled() }}
        run: ci/make-check.sh pkpm

      - name: Build pkpm-regression
        if: ${{ !cancelled() }}
        run: ci/make-module.sh pkpm regression

      - name: Test pkpm-valcheck
        if: ${{ !cancelled() }}
        run: ci/make-valcheck.sh pkpm "$CI_JOBS"

      - name: Compare regressions against main
        if: ${{ !cancelled() }}
        run: bash ci/runregression-against-main.sh

      - name: Publish summary
        if: always()
        run: |
          if [ -f "$CI_LOG_DIR/summary.txt" ]; then
            {
              echo '```text'
              cat "$CI_LOG_DIR/summary.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-ci-logs
          path: ${{ env.CI_LOG_DIR }}
          if-no-files-found: ignore
